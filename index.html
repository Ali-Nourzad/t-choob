<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>T-Choob AI</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="app-shell">
		<aside class="sidebar" id="sidebar">
			<div class="brand"><div class="brand-mark">T</div><div><strong>T-Choob</strong><span>AI Assistant</span></div></div>
			<button class="new-chat-btn" id="new-chat-btn" type="button">＋ گفت‌وگوی جدید</button>
			<div class="sidebar-title">گفت‌وگوها</div>
			<div class="conversation-list" id="conversation-list"></div>
			<div class="sidebar-bottom">
				<button class="side-action" id="theme-btn" type="button">حالت تاریک</button>
				<button class="side-action danger" id="clear-btn" type="button">پاک کردن گفت‌وگوها</button>
			</div>
		</aside>

		<main class="chat-area">
			<header class="chat-header">
				<button class="mobile-menu" id="mobile-menu" type="button">☰</button>
				<div class="chat-title">
					<div class="assistant-avatar">T</div>
					<div><strong>T-Choob AI</strong><span>دستیار هوشمند</span></div>
				</div>
				<div class="header-status"><span class="status-dot"></span> آماده</div>
			</header>

			<section class="messages" id="messages">
				<div class="welcome" id="welcome">
					<div class="welcome-icon">T</div>
					<h1>سلام، من T-Choob AI هستم</h1>
					<p>سؤال بپرس، تصویر یا فایل بفرست و در صورت فعال بودن قابلیت، تصویر تولید کن.</p>
					<div class="suggestions">
						<button type="button" data-prompt="برای توسعه T-Choob چه ایده‌هایی داری؟">ایده برای توسعه T-Choob</button>
						<button type="button" data-prompt="یک ساختار حرفه‌ای برای سایت T-Choob پیشنهاد بده.">ساختار سایت</button>
						<button type="button" data-prompt="این کد را بررسی کن و ایرادهایش را بگو.">بررسی کد</button>
					</div>
				</div>
			</section>

			<div class="composer-wrap">
				<div class="attachment-preview" id="attachment-preview"></div>
				<form class="composer" id="composer">
					<input id="file-input" type="file" hidden multiple accept="image/*,.pdf,.txt,.md,.csv,.json,.js,.html,.css,.py,.doc,.docx">
					<button class="icon-btn" id="attach-btn" type="button" title="افزودن فایل">＋</button>
					<textarea id="message-input" rows="1" placeholder="پیامت را بنوی..." autocomplete="off"></textarea>
					<button class="generate-image-btn" id="generate-image-btn" type="button">تصویر</button>
					<button class="send-btn" id="send-btn" type="submit">➤</button>
				</form>
				<div class="composer-note">کلید API فقط روی سرور نگهداری می‌شود.</div>
			</div>
		</main>
	</div>
	<script src="script.js"></script>
</body>
</html>
