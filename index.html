<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
	<meta charset="UTF-8">
	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0"
	>

	<title>T-Choob AI</title>

	<link
		rel="stylesheet"
		href="style.css"
	>
</head>

<body>

	<div class="app">

		<!-- =========================
		     Sidebar
		========================= -->

		<aside class="sidebar" id="sidebar">

			<div class="sidebar-header">

				<div class="brand">
					<div class="brand-mark">
						T
					</div>

					<div class="brand-text">
						<strong>T-Choob</strong>
						<span>AI Assistant</span>
					</div>
				</div>

				<button
					class="sidebar-close"
					id="sidebar-close"
					type="button"
					aria-label="بستن منو"
				>
					×
				</button>

			</div>


			<button
				class="new-chat"
				id="new-chat"
				type="button"
			>
				<span class="new-chat-icon">+</span>
				<span>گفتگوی جدید</span>
			</button>


			<div class="conversation-title">
				گفتگوهای اخیر
			</div>


			<div
				class="conversation-list"
				id="conversation-list"
			>
				<!-- گفتگوها با JavaScript ساخته می‌شوند -->
			</div>


			<div class="sidebar-bottom">

				<button
					class="sidebar-action"
					type="button"
					id="theme-toggle"
				>
					<span class="action-icon">◐</span>
					<span id="theme-text">حالت تاریک</span>
				</button>

				<div class="sidebar-footer">
					<span>T-Choob AI</span>
					<small>نسخه آزمایشی</small>
				</div>

			</div>

		</aside>


		<!-- =========================
		     Main
		========================= -->

		<main class="main">

			<header class="topbar">

				<div class="topbar-right">

					<button
						class="menu-button"
						id="menu-button"
						type="button"
						aria-label="باز کردن منو"
					>
						<span></span>
						<span></span>
						<span></span>
					</button>

					<div class="mobile-brand">
						T-Choob AI
					</div>

				</div>


				<div class="topbar-left">

					<div class="status">
						<span class="status-dot"></span>
						<span>آماده پاسخگویی</span>
					</div>

				</div>

			</header>


			<!-- =========================
			     Chat Area
			========================= -->

			<section class="chat-area">

				<div
					class="messages"
					id="messages"
				>

					<!-- Welcome -->

					<div
						class="welcome"
						id="welcome"
					>

						<div class="welcome-logo">
							T
						</div>

						<h1>
							سلام! من دستیار T-Choob هستم.
						</h1>

						<p>
							می‌تونی درباره محصولات، ایده‌ها،
							برنامه‌نویسی، طراحی و خیلی چیزهای دیگه
							با من صحبت کنی.
						</p>


						<div class="suggestions">

							<button
								type="button"
								class="suggestion"
								data-message="برای گسترش T-Choob چه ایده‌هایی داری؟"
							>
								<span>💡</span>
								<span>
									برای گسترش T-Choob چه ایده‌هایی داری؟
								</span>
							</button>


							<button
								type="button"
								class="suggestion"
								data-message="چطور می‌توانم یک کسب‌وکار اینترنتی بهتر بسازم؟"
							>
								<span>🚀</span>
								<span>
									چطور یک کسب‌وکار اینترنتی بهتر بسازم؟
								</span>
							</button>


							<button
								type="button"
								class="suggestion"
								data-message="یک ایده برای طراحی سایت T-Choob بده."
							>
								<span>🎨</span>
								<span>
									یک ایده برای طراحی سایت T-Choob بده.
								</span>
							</button>


							<button
								type="button"
								class="suggestion"
								data-message="چه قابلیت‌هایی می‌توانم به یک چت‌بات اضافه کنم؟"
							>
								<span>🤖</span>
								<span>
									چه قابلیت‌هایی می‌توانم به چت‌بات اضافه کنم؟
								</span>
							</button>

						</div>

					</div>

				</div>

			</section>


			<!-- =========================
			     Composer
			========================= -->

			<div class="composer-wrapper">

				<div class="composer">

					<textarea
						id="message-input"
						rows="1"
						placeholder="پیام خود را بنویسید..."
						aria-label="پیام"
					></textarea>


					<div class="composer-bottom">

						<div class="composer-info">
							T-Choob AI
						</div>


						<button
							class="send-button"
							id="send-button"
							type="button"
							aria-label="ارسال پیام"
						>
							<span>➤</span>
						</button>

					</div>

				</div>


				<div class="composer-note">
					هوش مصنوعی ممکن است گاهی پاسخ نادرست تولید کند.
				</div>

			</div>

		</main>

	</div>


	<!-- =========================
	     Overlay
	========================= -->

	<div
		class="overlay"
		id="overlay"
	></div>


	<script src="script.js"></script>

</body>
</html>
